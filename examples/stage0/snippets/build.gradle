plugins {
    id 'java'
    id "com.diffplug.spotless" version "8.0.0"
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
    main {
        java {
            setSrcDirs(['src'])
        }
    }
}

def snippetFiles = fileTree('src') { include '**/*.java' }.files
def runnableFiles = snippetFiles.findAll { it.text.contains('void main(') }
def snippetRunTasks = runnableFiles.collect { src ->
    def className = src.name - '.java'
    tasks.register("run${className}", JavaExec) {
        dependsOn 'compileJava'
        classpath = sourceSets.main.output
        mainClass = className
    }
}

tasks.register('runSnippets') {
    dependsOn snippetRunTasks
}

def allJavaFiles = fileTree(".") {
    include "**/*.java"
    exclude "**/build/**", "**/build-*/**"
}

// Compact source files (JEP 512) declare members at the top level with no enclosing
// type, which google-java-format cannot parse. They only get whitespace cleanup.
def compactSourceFiles = allJavaFiles.filter { it.text =~ /(?m)^void main\(/ }

spotless {
    java {
        target allJavaFiles - compactSourceFiles
        toggleOffOn()
        googleJavaFormat()
        trimTrailingWhitespace()
        endWithNewline()
    }
    format "compactSources", {
        target compactSourceFiles
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target fileTree(".") {
            include "**/*.gradle"
            exclude "**/build/**", "**/build-*/**"
        }
        greclipse()
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    format "misc", {
        target fileTree(".") {
            include "**/*.md", "**/.gitignore"
            exclude "**/build/**", "**/build-*/**"
        }
        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
}

tasks.named('compileJava') {
    dependsOn 'spotlessJavaCheck'
}

tasks.named('check') {
    dependsOn 'runSnippets'
}
